# Same idea as the Vite dev proxy: the browser only talks to this server, so no CORS setup is needed
server {
    listen 80;
    root /usr/share/nginx/html;

    location /stats  { proxy_pass http://gateway:8000; }
    location /health { proxy_pass http://gateway:8000; }

    location / {
        try_files $uri /index.html;
    }
}
